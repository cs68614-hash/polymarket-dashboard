name: Polymarket scan

on:
  schedule:
    # Asia/Shanghai is UTC+8
    # 09:30 / 15:30 / 21:30 CST => 01:30 / 07:30 / 13:30 UTC
    - cron: "30 1,7,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scan (read-only)
        run: node scripts/scan.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/latest.json docs/data/history.jsonl

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: update scan $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
